[package]
name = "heap-analyser"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Analyse the glibc malloc heap of an ELF core dump"
license = "MulanPSL-2.0"
readme = "README.md"
keywords = ["glibc", "malloc", "coredump", "heap", "debugging"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
goblin = "0.9"
memmap2 = "0.9"
sha2 = "0.10"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
# Core dumps can be large and the traversals are the hot path; thin LTO trims
# the read/hash paths without a heavy build cost.
lto = "thin"
